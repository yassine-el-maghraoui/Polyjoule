 

    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
         <link rel="stylesheet" href="style.css">
         <title>Galerie de Photos</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-color: #f4f4f4;
        }
    
        .gallery-container {
          position: relative;
          width: 100%;
          height: auto;
          overflow: hidden;
        }
    
        .gallery-slides {
          display: flex;
          transition: transform 1s ease-in-out;
          width: 100%;
        }
    
        .gallery-slide {
          width: 100%;
          height: 100%;
          flex-shrink: 0;
        }
    
        .gallery-slides img {
          width: 100%;
          height: 100%;
          object-fit: contain; 
          display: block;
        }
    
        .container {
          max-width: 1200px;
          margin: auto;
          padding: 10px;
          text-align: center;
        }
    
        .titre {
          text-align: left;
          font-size: 36px;
          margin-top: 20px;
          color: rgb(9, 0, 74);
        }
    
        .about-section {
          margin-top: 20px;
          width: 100%;
          position: relative;
          padding: 30px 20px;
          background: white;
          border-radius: 10px;
          margin-bottom: 50px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
      </style>
    </head>
    <body>
      <div class="container">
            <nav>
                <ul class="nav__links nav__left">
                    <li><a href="home.html" class="logo">Accueil</a></li>
                    <li><a href="historique.html">Historique</a></li>
                </ul>
                <ul class="nav__links nav__right">
                    <li><a href="calendrier-updated.html">Calendrier</a></li>
                    <li><a href="gallery.html">Gallerie</a></li>
                </ul>
            </nav>
        <h1 class="titre">Nos Souvenirs</h1>
    
        <section id="about" class="about-section">
          <div class="gallery-container">
            <div class="gallery-slides" id="gallerySlides">
              <div class="gallery-slide"><img src="assets/vehicule1.jpg" alt="Photo 1" onerror="this.src='assets/placeholder.png'"></div>
              <div class="gallery-slide"><img src="assets/vehicule2.jpg" alt="Photo 2" onerror="this.src='assets/placeholder.png'"></div>
              <div class="gallery-slide"><img src="assets/vehicule3.jpg" alt="Photo 3" onerror="this.src='assets/placeholder.png'"></div>
              <div class="gallery-slide"><img src="assets/vehicule4.jpg" alt="Photo 4" onerror="this.src='assets/placeholder.png'"></div>
            </div>
          </div>
        </section>
    
        <footer class="footer">
          <p>Copyright © 2025 Polyjoule. All rights reserved.</p>
          <ul class="footer__links">
              <li><a href="https://www.facebook.com/polyjoule">Facebook</a></li>
              <li><a href="https://www.instagram.com/polyjoule?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==">Instagram</a></li>
              <li><a href="https://www.linkedin.com/company/polyjoule/">Linkedin</a></li>
          </ul>
      </footer>
      </div>
    
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const slides = document.getElementById('gallerySlides');
          const slideElements = slides.querySelectorAll('.gallery-slide');
          let currentIndex = 0;
    
          // Set container width
          slides.style.width = `${slideElements.length * 100}%`;
    
          // Set each slide width
          slideElements.forEach(slide => {
            slide.style.width = `${100 / slideElements.length}%`;
          });
    
          // Slideshow
          setInterval(() => {
            currentIndex = (currentIndex + 1) % slideElements.length;
            slides.style.transform = `translateX(-${currentIndex * (100 / slideElements.length)}%)`;
          }, 3000);
        });
      </script>
    </body>
    </html>
